<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wing loading calculator: embed demo</title>
    <style>
      /* Deliberately hostile host styles, to show the widget is isolated from them. */
      * { font-family: Georgia, serif; color: purple; }
      button, input, select { all: unset; }
      body { margin: 0; padding: 16px; }
      .narrow { max-width: 420px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <h1>Host page</h1>
    <wing-calc></wing-calc>
    <div class="narrow">
      <h2>Narrow column, imperial</h2>
      <wing-calc units="imperial" theme="light"></wing-calc>
    </div>
    <script type="module" src="/src/embed.js"></script>
  </body>
</html>
